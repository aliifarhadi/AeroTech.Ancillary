openapi: 3.0.3
info:
  title: AeroTech.Ancillary — Quote API
  version: R5.4-phase2
  description: 'Wire contract of the stateless ancillary quote, as of Phase 2. Meaning of every field: docs/Ancillary-Domain-Master.md
    section 7. Later phases only add optional request members, response members and value names. Enumerated values
    are plain strings carrying the value name; the description lists the names known in this phase, and a receiver
    must accept names it does not know. 64-bit ids are written as strings and accepted as strings or numbers.'
paths:
  /Service/v1/AncillaryQuotes:
    post:
      operationId: quoteAncillaries
      summary: Catalogue of applicable ancillary occurrences, or the price of selected ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AncillaryQuoteRequest'
      responses:
        '200':
          description: Quote computed. An empty items list is a valid answer in catalogue mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AncillaryQuoteResult'
        '400':
          description: Shape validation failed (no business code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: Business error 16301-16307 (code in errors[0].code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 'Business error 16309: a selection is no longer current.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
components:
  schemas:
    AncillaryQuoteRequest:
      type: object
      required:
      - currencyId
      - asOf
      - travellers
      - bounds
      properties:
        currencyId:
          type: integer
          format: int32
          minimum: 1
        asOf:
          type: string
          format: date-time
          description: Pricing instant supplied by the caller.
        salesContext:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/SalesContext'
        travellers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Traveller'
        bounds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Bound'
        selections:
          type: array
          nullable: true
          description: Absent, null or empty means catalogue mode.
          items:
            $ref: '#/components/schemas/Selection'
        existing:
          type: array
          nullable: true
          description: Occurrences already purchased in the same order. They reduce the remaining quantity of the
            matching occurrence.
          items:
            $ref: '#/components/schemas/ExistingOccurrence'
    SalesContext:
      type: object
      description: Accepted from Phase 1; not evaluated before Phase 6.
      properties:
        channel:
          type: string
          nullable: true
        customerId:
          $ref: '#/components/schemas/NullableLongId'
        travelAgencyId:
          $ref: '#/components/schemas/NullableLongId'
        countryId:
          type: integer
          format: int32
          nullable: true
    Traveller:
      type: object
      required:
      - ref
      - passengerTypeCode
      - flightRefs
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 50
        passengerTypeCode:
          type: string
          description: A member name of AeroTech.Messages.AirPrice.Enums.PassengerTypeCode, e.g. ADT.
        flightRefs:
          type: array
          minItems: 1
          items:
            type: string
          description: The flights this traveller travels on. Each must be the ref of a flight in the request.
    Bound:
      type: object
      required:
      - ref
      - flights
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 50
        flights:
          type: array
          minItems: 1
          description: In travel order.
          items:
            $ref: '#/components/schemas/Flight'
    Flight:
      type: object
      required:
      - ref
      - flightId
      - originAirportId
      - destinationAirportId
      - departureDateTime
      - marketingAirlineId
      - operatingAirlineId
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique in the whole request.
        flightId:
          $ref: '#/components/schemas/LongId'
        flightCapacityId:
          $ref: '#/components/schemas/NullableLongId'
        originAirportId:
          type: integer
          format: int32
          minimum: 1
          description: Used by origin conditions (first flight of a bound).
        destinationAirportId:
          type: integer
          format: int32
          minimum: 1
          description: Used by destination conditions (last flight of a bound).
        departureDateTime:
          type: string
          format: date-time
          description: With its local offset; the calendar date in that offset drives travel windows.
        marketingAirlineId:
          type: integer
          format: int32
          minimum: 1
        operatingAirlineId:
          type: integer
          format: int32
          minimum: 1
        aircraftId:
          type: integer
          format: int32
          nullable: true
        cabinClassId:
          type: integer
          format: int32
          nullable: true
        rbdId:
          $ref: '#/components/schemas/NullableLongId'
    Selection:
      type: object
      required:
      - productRef
      - productVersion
      - priceRuleId
      - travellerRef
      - quantity
      properties:
        productRef:
          type: string
          pattern: ^[A-Z0-9]{2,20}$
        productVersion:
          type: integer
          format: int32
          minimum: 1
          description: The productVersion of the catalogue item the customer chose.
        priceRuleId:
          allOf:
          - $ref: '#/components/schemas/LongId'
          description: The priceRuleId of the catalogue item the customer chose.
        travellerRef:
          type: string
        boundRef:
          type: string
          nullable: true
        flightRef:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int32
          minimum: 1
    AncillaryQuoteResult:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AncillaryQuote'
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorItem'
    AncillaryQuote:
      type: object
      required:
      - currencyId
      - asOf
      - items
      properties:
        currencyId:
          type: integer
          format: int32
        asOf:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
    QuoteItem:
      type: object
      required:
      - ownerAirlineId
      - productRef
      - productVersion
      - type
      - name
      - salesScope
      - travellerRef
      - boundRef
      - coveredFlightRefs
      - unit
      - minQuantity
      - maxQuantity
      - quantity
      - codes
      - terms
      - document
      - inventory
      - priceRuleId
      - priceLines
      - unitTotal
      - total
      properties:
        ownerAirlineId:
          type: integer
          format: int32
        productRef:
          type: string
        productVersion:
          type: integer
          format: int32
          description: The Active version. Sent back in a selection.
        type:
          type: string
          description: 'Open enum AncillaryProductType. Known: ExtraBaggage, LoungeAccess.'
        name:
          type: string
        description:
          type: string
          nullable: true
        salesScope:
          type: string
          description: 'Open enum AncillarySalesScope. Known: TravellerBound, TravellerSegment.'
        travellerRef:
          type: string
        boundRef:
          type: string
        flightRef:
          type: string
          nullable: true
          description: The flight of a flight-scoped item (TravellerSegment); null for a bound-scoped item.
        coveredFlightRefs:
          type: array
          items:
            type: string
          description: 'The traveller''s flights covered by this occurrence, in travel order. Extra baggage: always
            exactly one (Phase 1 limitation). Flight-scoped item: its flight.'
        unit:
          type: string
          description: 'Open enum AncillaryQuantityUnit. Known: Piece, Each.'
        minQuantity:
          type: integer
          format: int32
        maxQuantity:
          type: integer
          format: int32
          description: Quantity.Max minus the existing quantity of this occurrence.
        quantity:
          type: integer
          format: int32
        codes:
          $ref: '#/components/schemas/IndustryCodes'
        baggage:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/BaggageDetail'
        lounge:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/LoungeDetail'
          description: Present for LoungeAccess items; null otherwise.
        terms:
          $ref: '#/components/schemas/SalesTerms'
        document:
          $ref: '#/components/schemas/DocumentPolicy'
        inventory:
          $ref: '#/components/schemas/Inventory'
        priceRuleId:
          allOf:
          - $ref: '#/components/schemas/LongId'
          description: The selected price rule. Sent back in a selection.
        priceLines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotePriceLine'
          description: The Ancillary line first, then the other lines in rule order.
        unitTotal:
          type: number
        total:
          type: number
          description: 'Sum of all line amounts: the amount payable for this occurrence, taxes included. (On an
            EMD the coupon value is the Ancillary line only; Tax lines stay at document level.)'
    IndustryCodes:
      type: object
      properties:
        serviceTypeCode:
          type: string
        groupCode:
          type: string
        subGroupCode:
          type: string
          nullable: true
        description1Code:
          type: string
          nullable: true
        description2Code:
          type: string
          nullable: true
      description: Classification of the product. groupCode, subGroupCode and the description codes come from the
        enabled service sub code (document.rfisc).
      required:
      - serviceTypeCode
      - groupCode
    BaggageDetail:
      type: object
      properties:
        pieces:
          type: integer
          format: int32
          nullable: true
        weight:
          type: number
          nullable: true
        weightUnit:
          type: string
          nullable: true
          description: 'Open enum AncillaryWeightUnit. Known: Kg, Lbs.'
      description: What one unit of the product grants.
    SalesTerms:
      type: object
      required:
      - refundable
      properties:
        refundable:
          type: boolean
        commissionable:
          type: boolean
          nullable: true
        reusable:
          type: boolean
          nullable: true
        formOfRefundCode:
          type: string
          nullable: true
        interlineSettlementAllowed:
          type: boolean
          nullable: true
    DocumentPolicy:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: 'Open enum AncillaryDocumentType. Known: EmdAssociated, EmdStandalone.'
        rfic:
          type: string
          nullable: true
          description: Reason For Issuance Code with which AeroTech sells the sub code.
        rfisc:
          type: string
          nullable: true
          description: Reason For Issuance Sub Code = the industry service sub code.
      description: What Ordering must issue. Ordering stores type, rfic and rfisc with the sold service, so that
        the document can be issued later without asking Ancillary.
    Inventory:
      type: object
      required:
      - control
      properties:
        control:
          type: string
          description: 'Open enum AncillaryInventoryControl. Known: Unlimited.'
        remaining:
          type: integer
          format: int32
          nullable: true
      description: 'control tells whether stock must be reserved before issuing: Unlimited = no; Quota = at Ancillary;
        SeatMap = at FlightFlow.'
    QuotePriceLine:
      type: object
      required:
      - category
      - unitAmount
      - amount
      properties:
        category:
          type: string
          description: 'Open enum AncillaryPriceLineCategory. Known: Ancillary, Tax.'
        code:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        unitAmount:
          type: number
          description: Fixed amount for one quantity unit.
        amount:
          type: number
          description: unitAmount x quantity.
    LongId:
      type: string
      pattern: ^[0-9]+$
      description: 64-bit id. Written as a string; a JSON number is also accepted on input.
    NullableLongId:
      type: string
      pattern: ^[0-9]+$
      nullable: true
    ErrorResult:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    ErrorItem:
      type: object
      properties:
        code:
          type: integer
          format: int32
          nullable: true
        title:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
    ExistingOccurrence:
      type: object
      required:
      - productRef
      - travellerRef
      - quantity
      properties:
        productRef:
          type: string
        travellerRef:
          type: string
        boundRef:
          type: string
          nullable: true
        flightRef:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int32
          minimum: 1
    LoungeDetail:
      type: object
      required:
      - airportIds
      properties:
        airportIds:
          type: array
          items:
            type: integer
            format: int32
          description: Airports where the lounge is offered, in the order defined on the product.
